# Generated by edgepoint. Do not edit — run `edgepoint sync` instead.
#
# Push to main → build here → the server pulls and restarts.
#
# The build happens on GitHub's x86 runners because the $7 Lightsail box has
# 1 GB of RAM and `next build` needs several times that. Lightsail has no ARM
# option either, so building on an Apple Silicon laptop would mean emulation.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the server at once.
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image=${IMAGE,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Lightsail is x86 only.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy deployment files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/compose.prod.yaml,deploy/Caddyfile,deploy/migrate.sh,supabase/migrations/*"
          target: /srv/app
          strip_components: 1

      - name: Pull, migrate, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /srv/app

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Remember what is running, so a failure can go straight back to it.
            docker compose -f compose.prod.yaml config --images | grep -v caddy | grep -v postgres > .previous-image || true

            export APP_IMAGE="${{ needs.build.outputs.image }}"
            docker pull "$APP_IMAGE"

            # Back up before migrating. Migrations are the one deploy step that
            # a rollback cannot undo on its own.
            docker compose -f compose.prod.yaml exec -T db \
              pg_dump -U postgres app | gzip > "backups/pre-deploy-$(date +%F-%H%M).sql.gz" || true

            docker compose -f compose.prod.yaml up -d --remove-orphans
            # Invoked through sh: scp does not reliably preserve the exec bit.
            sh migrate.sh

            # Prove it actually serves traffic before calling this a success.
            for i in $(seq 1 30); do
              if curl -fsS localhost:3000/api/health >/dev/null 2>&1; then
                echo "healthy"; docker image prune -f; exit 0
              fi
              sleep 2
            done

            echo "New version did not become healthy — rolling back." >&2
            export APP_IMAGE="$(cat .previous-image)"
            docker compose -f compose.prod.yaml up -d
            exit 1
