# Generated by edgepoint. Do not edit — run `edgepoint sync` instead.
#
# The throwaway environment the printed test guide is captured in. Started by
# `./edge guide` and destroyed the moment it finishes. Run nothing else with it.
#
# It is a separate compose project, so it shares nothing with `./edge dev`: the
# builder's own local data is never touched, and never ends up in a screenshot
# that gets printed and handed to someone. See standard/privacy.md.
#
# Nothing is published on the machine. The browser runs inside this network and
# reaches the app as `app:3000`, so this can run while `./edge dev` is up without
# fighting it for port 3000.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      # Its own copy, for the reason in compose.yaml: host binaries don't run in
      # here. Installed on first use by `./edge guide`, then kept — the teardown
      # deliberately leaves volumes alone so the next guide isn't another install.
      - node_modules:/app/node_modules
    env_file:
      # The same local settings as `./edge dev`, so the app boots identically.
      # Safe because every address in the seed data is @example.com: a
      # walkthrough that sends a confirmation email cannot reach a real person.
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

  # Where the walkthrough runs: Playwright, then Chromium printing the PDF.
  toolbox:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["tools"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      BASE_URL: http://app:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: supabase/postgres:15.8.1.060
    environment:
      POSTGRES_PASSWORD: postgres
    # The database lives in memory and nowhere else. That is what makes the
    # teardown total — there is no volume left holding the data a screenshot was
    # taken of — and it means every guide is captured against a database in the
    # state a new customer would find, not one the builder has been poking at.
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      # More patient than compose.yaml's: an in-memory database is built from
      # scratch on every start, so this pays the first-run cost every time.
      retries: 60

volumes:
  node_modules:
