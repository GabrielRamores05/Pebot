# Generated by edgepoint. Do not edit — run `edgepoint sync` instead.
#
# What runs on the Lightsail box. One instance serves every tenant — see
# standard/deploy.md. Nothing here is built on the server.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates — losing this re-issues everything
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:?set APP_IMAGE}
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Connects as the application role, never the owner. The owner bypasses
      # row level security, which would silently disable every access rule in
      # the database. See standard/access.md.
      DATABASE_URL: postgres://app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    # Same image as local development, so auth.uid() and the RLS helpers behave
    # identically in both places.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    # Tuned for 1 GB shared three ways. The defaults assume a machine with room.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  db_data:
