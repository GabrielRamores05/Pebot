# Generated by edgepoint. Do not edit — run `edgepoint sync` instead.
#
# Run things with ./edge, not with docker compose directly.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # node_modules must NOT come from the host: binaries built on macOS or
      # Windows will not run in the container, and the error says nothing useful.
      - node_modules:/app/node_modules
    env_file:
      - path: .env.local
        required: false
    environment:
      # Bind mounts don't deliver filesystem events reliably across the VM
      # boundary, so the dev server polls instead. Without this, saving a file
      # appears to do nothing.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy

  # One-off commands: npm, tests, scripts. Kept out of `up` by the profile.
  toolbox:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["tools"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      BASE_URL: http://app:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: supabase/postgres:15.8.1.060
    # Deliberately no published port. The app reaches the database over the
    # compose network as `db:5432`, and `./edge psql` goes in through the
    # container — so nothing needs to be exposed on the machine.
    #
    # Publishing a fixed port guarantees "port is already allocated" the moment
    # a builder runs two projects, or has a Supabase stack up. That error is
    # undiagnosable for the person who would hit it, in exchange for a
    # convenience they have no tool to use.
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      # Read-only, and deliberately NOT /docker-entrypoint-initdb.d. Mounting
      # anything onto that directory hides the image's own bootstrap — roles,
      # the auth schema, extensions — and the database then starts healthy but
      # unusable ("role postgres does not exist"). `./edge` applies these once
      # the database is up, which also lets them run against an existing
      # database rather than only on the very first start.
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  node_modules:
  db_data:
